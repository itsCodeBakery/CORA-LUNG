gate_b_pilot:
  harness_version: '1.0'
  seed: 17
data:
  cache_version: '1.2'
  development_only: true
  permanent_development_volumes: 4
  dense_masks_accessible_to_trainer: false
patch_sampling:
  patch_zyx:
  - 48
  - 128
  - 128
  batch_size: 1
  gradient_accumulation: 2
  deterministic: true
  anchor_sampling:
    foreground_probability: 0.5
    explicit_background_probability: 0.25
    random_probability: 0.25
model:
  family: residual_3d_unet
  widths:
  - 16
  - 32
  - 64
  - 128
  embedding_dimension: 64
  instance_normalization: true
  activation: leaky_relu
  level_0:
    convolution_kernel:
    - 1
    - 3
    - 3
    downsample_stride:
    - 1
    - 2
    - 2
  deeper_levels:
    convolution_kernel:
    - 3
    - 3
    - 3
    downsample_stride:
    - 2
    - 2
    - 2
loss:
  partial_bce: true
  partial_dice: true
  unknown_label: -1
  query_holdout:
    applied_to_bce_only: true
    partial_dice_sees_full_sparse_annotation: true
    query_bce_lambda: 1.0
    exact_global_label_normalization: true
training_contract:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  pilot_epochs: 30
  warmup_epochs: 10
  replay_probability_after_warmup: 0.75
  relation_temperature: 0.1
  amp: true
  primary_checkpoint: final_epoch
  dense_validation_model_selection: prohibited
gate_d:
  gpu_memory_limit_gb: 14.5
  dry_run_optimizer_step: false
