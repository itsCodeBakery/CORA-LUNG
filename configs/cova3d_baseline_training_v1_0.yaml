effective_protocol: COVA3D_1.0+A1+A1.1+A1.2
status: PROSPECTIVELY_FROZEN_BEFORE_FIRST_COVA_OPTIMIZER_STEP
scientific_role: Strong architecture-controlled sparse-supervision baseline for testing
  the frozen coverage-by-geometry factorial design.
literature_rationale:
  baseline_family: 3-D nnU-Net-style
  sparse_learning: partial loss on labelled voxels only
  reference_1: 'Gotkowski et al., Revisiting 3D Medical Scribble Supervision: Benchmarking
    Beyond Cardiac Segmentation, MICCAI 2025.'
  reference_2: nnU-Net ignore-label / partial-loss sparse supervision.
architecture:
  class: COVA3DNNUNetStyle
  input_channels: 1
  output_channels: 1
  features:
  - 32
  - 64
  - 128
  - 256
  - 320
  encoder_kernels:
  - - 1
    - 3
    - 3
  - - 3
    - 3
    - 3
  - - 3
    - 3
    - 3
  - - 3
    - 3
    - 3
  - - 3
    - 3
    - 3
  downsample_strides:
  - - 1
    - 2
    - 2
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 2
  convolutions_per_stage: 2
  normalization: InstanceNorm3d_affine
  activation: LeakyReLU_0.01
  upsampling: ConvTranspose3d
  skip_connections: concatenation
  deep_supervision: false
  deep_supervision_reason: Avoid scale-dependent remapping of extremely sparse labels
    and keep the factorial annotation intervention identical at the optimized output
    scale.
  dropout: false
  weight_initialization: KaimingNormal_leaky_relu
patch:
  shape_zyx:
  - 48
  - 128
  - 128
  microbatch_size: 1
  accumulation_steps: 2
  effective_batch_in_optimizer_updates: 2
sampling:
  patient_sampling: uniform
  foreground_center_probability: 0.5
  background_center_probability: 0.25
  uniform_crop_probability: 0.25
  condition_specific_sampling_rule: false
  same_patient_schedule_across_conditions: true
augmentation:
  paired_across_conditions: true
  spatial:
    flip_x_probability: 0.5
    flip_y_probability: 0.5
    flip_z_probability: 0.0
    rotation: false
    elastic: false
    zoom: false
  intensity:
    scale_uniform:
    - 0.9
    - 1.1
    shift_uniform:
    - -0.1
    - 0.1
    gaussian_noise_sigma_uniform:
    - 0.0
    - 0.03
    clip_after_augmentation:
    - -1.0
    - 1.0
paired_randomization:
  model_initialization: derived from seed + outer_fold; CONDITION EXCLUDED
  patient_schedule: derived from seed + outer_fold + epoch; CONDITION EXCLUDED
  augmentation: derived from seed + outer_fold + epoch + microbatch_index; CONDITION
    EXCLUDED
  purpose: Reduce nuisance Monte-Carlo variation between paired factorial conditions.
loss:
