  labelled_voxels_only: true
  partial_BCE_weight: 1.0
  partial_Dice_weight: 1.0
  total: partial_BCE + partial_Dice
  pseudo_labels: false
  dense_training_labels: false
  consistency_loss: false
  replay_loss: false
  teacher_student: false
